; Godot export presets -- COMMITTED ON PURPOSE.
;
; If this file is gitignored, a fresh checkout has no presets at all and the
; build dies at the export step with:
;
;   ERROR: This project doesn't have an export_presets.cfg file at its root.
;
; The preset names below are what the build scripts pass to --export-release
; ("Windows Desktop" from build.ps1 and build.sh, "Linux" from build.sh) --
; renaming either one breaks that script. Godot fills in every option not listed
; here from the platform defaults, so this stays short on purpose: only the
; settings the build actually depends on are pinned.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
; OFF deliberately. "Modify Resources" stamps icon + version metadata into the
; .exe, which requires the external `rcedit` tool -- not configured by default
; on Windows and not present at all when exporting from Linux. With it on, every
; export ends in "Could not start rcedit executable". To enable: add a real
; icon.svg, install rcedit, set its path in Editor Settings (Export > Windows >
; rcedit), and flip this back to true.
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Bridge to Friendship"
application/product_name="Bridge to Friendship"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
